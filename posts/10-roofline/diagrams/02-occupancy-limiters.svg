</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="638">Registers bind: two blocks fit, half the warp slots fill</text>
<text x="40" y="76" class="t-subtitle" data-w="695">Derived by roofline_model.py: 256 threads per block, 96 registers per thread, no shared memory.</text>
<text x="40" y="120" class="t-head" data-w="259">Blocks per SM each limit allows</text>
