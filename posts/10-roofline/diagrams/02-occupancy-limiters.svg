<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-02-occupancy-limiters-title" aria-describedby="cuda-02-occupancy-limiters-desc">
<title id="cuda-02-occupancy-limiters-title">Registers bind: two blocks fit, half the warp slots fill</title>
<desc id="cuda-02-occupancy-limiters-desc">Left: horizontal bars of the blocks per SM that each limit allows for a launch of 256-thread blocks using 96 registers per thread and no shared memory: block size 4, registers 2, shared memory 16; the registers bar is red, the binding limit. Right: the SM's 32 warp slots drawn as four rows of eight, one row per quarter of the register file; 16 slots, four per row, hold the warps of the 2 resident blocks, and the other 16 are empty: occupancy 50%.</desc>
<style>
  :root {
    --cuda-bg: #FAFAF7;
    --cuda-surface: #FFFFFF;
    --cuda-ink: #1A1A1A;
    --cuda-ink-muted: #5C5C5C;
    --cuda-ink-subtle: #9A9A9A;
    --cuda-border: #D9D9D4;
    --cuda-primary: #5B7FBF;
    --cuda-accent: #D98E5F;
    --cuda-success: #5C9E78;
