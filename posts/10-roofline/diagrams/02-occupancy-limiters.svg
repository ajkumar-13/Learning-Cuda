      --cuda-red-soft: #3A1A18;
      --cuda-red-line: #7A3A34;
      --cuda-purple: #D58CC4;
      --cuda-purple-ink: #E2A6D3;
      --cuda-purple-soft: #331F2E;
      --cuda-purple-line: #6E4466;
    }
  }
  .bg { fill: var(--cuda-bg); }
  text { font-family: -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--cuda-ink); }
  .t-title { font-size: 24px; font-weight: 600; fill: var(--cuda-ink); }
  .t-subtitle { font-size: 15px; font-weight: 400; fill: var(--cuda-ink-muted); }
  .t-head { font-size: 16px; font-weight: 600; fill: var(--cuda-ink); }
  .t-label { font-size: 14px; font-weight: 400; fill: var(--cuda-ink); }
  .t-note { font-size: 14px; font-weight: 400; fill: var(--cuda-ink-muted); }
  .t-value { font-size: 14px; font-weight: 600; fill: var(--cuda-ink); font-variant-numeric: tabular-nums; }
  .t-tick { font-size: 13px; font-weight: 400; fill: var(--cuda-ink-muted); font-variant-numeric: tabular-nums; }
  .t-math { font-size: 17px; font-weight: 400; fill: var(--cuda-ink); font-variant-numeric: tabular-nums; }
  .t-op { font-size: 24px; font-weight: 400; fill: var(--cuda-ink-muted); }
  .t-code { font-size: 14px; font-weight: 400; fill: var(--cuda-ink); font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  .t-cell14 { font-size: 14px; font-weight: 500; fill: var(--cuda-ink); font-variant-numeric: tabular-nums; }
  .t-cell16 { font-size: 16px; font-weight: 500; fill: var(--cuda-ink); font-variant-numeric: tabular-nums; }
  .t-cell18 { font-size: 18px; font-weight: 500; fill: var(--cuda-ink); font-variant-numeric: tabular-nums; }
  .i { font-style: italic; }
  .sub { font-size: 13px; }
  .b { font-weight: 700; }
  .nofill { fill: none; }
  .cell { fill: var(--cuda-surface); stroke: var(--cuda-rule); stroke-width: 1; }
  .card { fill: var(--cuda-neutral-soft); stroke: var(--cuda-border); stroke-width: 1; }
  .frame { fill: none; stroke: var(--cuda-ink-muted); stroke-width: 1.5; }
  .rule1 { fill: none; stroke: var(--cuda-rule); stroke-width: 1; }
  .fine { fill: none; stroke: var(--cuda-border); stroke-width: 0.75; }
  .gridline { fill: none; stroke: var(--cuda-grid); stroke-width: 0.75; }
  .axis { fill: none; stroke: var(--cuda-ink-muted); stroke-width: 1; }
  .flow { fill: none; stroke: var(--cuda-arrow); stroke-width: 1.5; }
  .lead { fill: none; stroke: var(--cuda-arrow); stroke-width: 1; stroke-dasharray: 4 4; }
  .brace { fill: none; stroke: var(--cuda-ink-muted); stroke-width: 1; }
  .arrowhead { fill: var(--cuda-arrow); }
  .emph { fill: none; stroke-width: 2.5; }
  .w1 { stroke-width: 1; }
  .w15 { stroke-width: 1.5; }
  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-ink { fill: var(--cuda-ink); }
  .f-orange { fill: var(--cuda-orange); }
  .f-red { fill: var(--cuda-red); }
  .f-red-ink { fill: var(--cuda-red-ink); }
  .s-orange { stroke: var(--cuda-orange); }
  .s-red { stroke: var(--cuda-red); }
</style>
<defs>
<marker id="cuda-02-occupancy-limiters-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
