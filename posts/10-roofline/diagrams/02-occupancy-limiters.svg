    --cuda-blue-soft: #E3F0F8;
    --cuda-blue-line: #9CC6E0;
    --cuda-orange: #C98500;
    --cuda-orange-ink: #8A5B00;
    --cuda-orange-soft: #FBF0D9;
    --cuda-orange-line: #E5C27A;
    --cuda-green: #008F68;
    --cuda-green-ink: #006B4E;
    --cuda-green-soft: #DFF3EC;
    --cuda-green-line: #8FCDB8;
    --cuda-red: #A8322A;
    --cuda-red-ink: #8F2A23;
    --cuda-red-soft: #F8E3E1;
    --cuda-red-line: #DDA49F;
    --cuda-purple: #A14D8C;
    --cuda-purple-ink: #833E72;
    --cuda-purple-soft: #F4E4EF;
    --cuda-purple-line: #D3A5C6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --cuda-bg: #0E0F12;
      --cuda-surface: #16181C;
      --cuda-ink: #F2F2EE;
      --cuda-ink-muted: #B4B4AE;
      --cuda-ink-subtle: #6E6E68;
