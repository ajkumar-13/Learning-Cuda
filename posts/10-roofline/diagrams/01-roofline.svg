<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-01-roofline-title" aria-describedby="cuda-01-roofline-desc">
<title id="cuda-01-roofline-title">Measured kernels under the GTX 1650's two roofs</title>
<desc id="cuda-01-roofline-desc">A log-log chart of attainable performance in GFLOP/s against arithmetic intensity in FLOP per byte, from 0.01 to 1,000. The derived roof rises along the 160 GB/s bandwidth slope to the ridge point at 19.5 FLOP per byte and stays flat at the compute peak of 3,118 GFLOP/s. Measured points: vector add 12.1 GFLOP/s at 0.083, the shuffle reduction 38.6 at 0.25, the tiled matrix multiply 305 at 3.97, cuBLAS 2,189 at 171 (its intensity is at most that), and the naive matrix multiply 196 at 0.25, above its slope roof of 40; a dashed arrow leads to a hollow mark at 1.225 FLOP per byte, the least intensity that 196 GFLOP/s implies. A note says the padded transpose, with no arithmetic, moved 124.4 GB/s and cannot be drawn on a log axis.</desc>
