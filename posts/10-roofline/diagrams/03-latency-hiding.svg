<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-03-latency-hiding-title" aria-describedby="cuda-03-latency-hiding-desc">
<title id="cuda-03-latency-hiding-title">More warps help until the bytes in flight cover the latency</title>
<desc id="cuda-03-latency-hiding-desc">A line chart of attainable bandwidth in GB/s, 0 to 160, against resident warps per SM, 0 to 32 (0 to 100% occupancy), for an illustrative memory latency of 400 cycles at 1,740 MHz. With one 128-byte load in flight per warp the line rises to 160 GB/s at 21 warps; with two independent loads at 11 warps; with four at 6 warps. Each line is flat at 160 GB/s after its knee.</desc>
<style>
