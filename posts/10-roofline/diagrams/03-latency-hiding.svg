</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="704">More warps help until the bytes in flight cover the latency</text>
<text x="40" y="76" class="t-subtitle" data-w="587">Derived by roofline_model.py from Little's law; the 400-cycle latency is illustrative.</text>
