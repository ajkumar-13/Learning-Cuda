    --cuda-bg: #FAFAF7;
    --cuda-surface: #FFFFFF;
    --cuda-ink: #1A1A1A;
    --cuda-ink-muted: #5C5C5C;
    --cuda-ink-subtle: #9A9A9A;
    --cuda-border: #D9D9D4;
    --cuda-primary: #5B7FBF;
    --cuda-accent: #D98E5F;
    --cuda-success: #5C9E78;
