    --cuda-neutral-3: #8E8E88;
    --cuda-on-fill: #FFFDF9;
    --cuda-on-accent: #1A1A1A;
    --cuda-grid: #E4E4DE;
    --cuda-rule: #8E8E88;
    --cuda-arrow: #6E6E68;
    --cuda-neutral-soft: #F2F2EE;
