<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-03-histogram-perf-title" aria-describedby="cuda-03-histogram-perf-desc">
<title id="cuda-03-histogram-perf-title">Privatization wins on random and on solid data</title>
<desc id="cuda-03-histogram-perf-desc">Two horizontal bar charts on one scale of 0 to 160 GB/s, measured on the author's GTX 1650. Random values: global atomics 13.5 GB/s, privatized 117.2 GB/s, 8.7 times faster. Solid color: global atomics 6.6 GB/s, privatized 43.1 GB/s, 6.5 times faster. A dotted line marks the 160 GB/s theoretical peak.</desc>
<style>
  :root {
    --cuda-bg: #FAFAF7;
    --cuda-surface: #FFFFFF;
    --cuda-ink: #1A1A1A;
    --cuda-ink-muted: #5C5C5C;
    --cuda-ink-subtle: #9A9A9A;
    --cuda-border: #D9D9D4;
    --cuda-primary: #5B7FBF;
    --cuda-accent: #D98E5F;
    --cuda-success: #5C9E78;
    --cuda-warn: #B8895A;
    --cuda-alert: #C66B5E;
    --cuda-neutral-1: #EAEAE4;
    --cuda-neutral-2: #CFCFC8;
    --cuda-neutral-3: #8E8E88;
    --cuda-on-fill: #FFFDF9;
    --cuda-on-accent: #1A1A1A;
    --cuda-grid: #E4E4DE;
    --cuda-rule: #8E8E88;
    --cuda-arrow: #6E6E68;
    --cuda-neutral-soft: #F2F2EE;
    --cuda-blue: #0072B2;
    --cuda-blue-ink: #005A8C;
    --cuda-blue-soft: #E3F0F8;
    --cuda-blue-line: #9CC6E0;
    --cuda-orange: #C98500;
    --cuda-orange-ink: #8A5B00;
    --cuda-orange-soft: #FBF0D9;
    --cuda-orange-line: #E5C27A;
    --cuda-green: #008F68;
    --cuda-green-ink: #006B4E;
    --cuda-green-soft: #DFF3EC;
    --cuda-green-line: #8FCDB8;
    --cuda-red: #A8322A;
    --cuda-red-ink: #8F2A23;
    --cuda-red-soft: #F8E3E1;
    --cuda-red-line: #DDA49F;
    --cuda-purple: #A14D8C;
    --cuda-purple-ink: #833E72;
    --cuda-purple-soft: #F4E4EF;
    --cuda-purple-line: #D3A5C6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --cuda-bg: #0E0F12;
      --cuda-surface: #16181C;
      --cuda-ink: #F2F2EE;
      --cuda-ink-muted: #B4B4AE;
      --cuda-ink-subtle: #6E6E68;
      --cuda-border: #2A2D33;
      --cuda-primary: #8BA8E0;
      --cuda-accent: #E8B088;
      --cuda-success: #7FBF9B;
      --cuda-warn: #D4B58A;
      --cuda-alert: #D88880;
      --cuda-neutral-1: #1F2229;
      --cuda-neutral-2: #2C3038;
      --cuda-neutral-3: #6E6E68;
      --cuda-on-fill: #14161A;
      --cuda-on-accent: #1A1A1A;
      --cuda-grid: #23262D;
      --cuda-rule: #6A6D74;
      --cuda-arrow: #9A9A94;
      --cuda-neutral-soft: #1C1E23;
      --cuda-blue: #5AA8E0;
      --cuda-blue-ink: #7DBBE8;
      --cuda-blue-soft: #14283A;
      --cuda-blue-line: #2E5878;
      --cuda-orange: #E8B040;
      --cuda-orange-ink: #F0C060;
      --cuda-orange-soft: #33260F;
      --cuda-orange-line: #6E5222;
      --cuda-green: #3CC497;
      --cuda-green-ink: #62D1AC;
      --cuda-green-soft: #10302A;
      --cuda-green-line: #2A6A55;
      --cuda-red: #E8796E;
      --cuda-red-ink: #F09A90;
      --cuda-red-soft: #3A1A18;
      --cuda-red-line: #7A3A34;
      --cuda-purple: #D58CC4;
      --cuda-purple-ink: #E2A6D3;
      --cuda-purple-soft: #331F2E;
      --cuda-purple-line: #6E4466;
    }
  }
  .bg { fill: var(--cuda-bg); }
  text { font-family: -apple-system, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif; fill: var(--cuda-ink); }
  .t-title { font-size: 24px; font-weight: 600; fill: var(--cuda-ink); }
  .t-subtitle { font-size: 15px; font-weight: 400; fill: var(--cuda-ink-muted); }
  .t-head { font-size: 16px; font-weight: 600; fill: var(--cuda-ink); }
  .t-label { font-size: 14px; font-weight: 400; fill: var(--cuda-ink); }
  .t-note { font-size: 14px; font-weight: 400; fill: var(--cuda-ink-muted); }
  .t-value { font-size: 14px; font-weight: 600; fill: var(--cuda-ink); font-variant-numeric: tabular-nums; }
  .t-tick { font-size: 13px; font-weight: 400; fill: var(--cuda-ink-muted); font-variant-numeric: tabular-nums; }
  .t-math { font-size: 17px; font-weight: 400; fill: var(--cuda-ink); font-variant-numeric: tabular-nums; }
  .t-op { font-size: 24px; font-weight: 400; fill: var(--cuda-ink-muted); }
  .t-code { font-size: 14px; font-weight: 400; fill: var(--cuda-ink); font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  .t-cell14 { font-size: 14px; font-weight: 500; fill: var(--cuda-ink); font-variant-numeric: tabular-nums; }
  .t-cell16 { font-size: 16px; font-weight: 500; fill: var(--cuda-ink); font-variant-numeric: tabular-nums; }
  .t-cell18 { font-size: 18px; font-weight: 500; fill: var(--cuda-ink); font-variant-numeric: tabular-nums; }
  .i { font-style: italic; }
  .sub { font-size: 13px; }
  .b { font-weight: 700; }
  .nofill { fill: none; }
  .cell { fill: var(--cuda-surface); stroke: var(--cuda-rule); stroke-width: 1; }
  .card { fill: var(--cuda-neutral-soft); stroke: var(--cuda-border); stroke-width: 1; }
  .frame { fill: none; stroke: var(--cuda-ink-muted); stroke-width: 1.5; }
  .rule1 { fill: none; stroke: var(--cuda-rule); stroke-width: 1; }
  .fine { fill: none; stroke: var(--cuda-border); stroke-width: 0.75; }
  .gridline { fill: none; stroke: var(--cuda-grid); stroke-width: 0.75; }
  .axis { fill: none; stroke: var(--cuda-ink-muted); stroke-width: 1; }
  .flow { fill: none; stroke: var(--cuda-arrow); stroke-width: 1.5; }
  .lead { fill: none; stroke: var(--cuda-arrow); stroke-width: 1; stroke-dasharray: 4 4; }
  .brace { fill: none; stroke: var(--cuda-ink-muted); stroke-width: 1; }
  .arrowhead { fill: var(--cuda-arrow); }
  .emph { fill: none; stroke-width: 2.5; }
  .w1 { stroke-width: 1; }
  .w15 { stroke-width: 1.5; }
  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-green { fill: var(--cuda-green); }
  .f-green-ink { fill: var(--cuda-green-ink); }
  .f-ink-muted { fill: var(--cuda-ink-muted); }
  .f-red { fill: var(--cuda-red); }
  .f-red-ink { fill: var(--cuda-red-ink); }
  .s-ink-muted { stroke: var(--cuda-ink-muted); }
</style>
<defs>
<marker id="cuda-03-histogram-perf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
<clipPath id="cuda-03-histogram-perf-clip-1"><rect x="160" y="184" width="248" height="176"/></clipPath>
<clipPath id="cuda-03-histogram-perf-clip-2"><rect x="616" y="184" width="248" height="176"/></clipPath>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="572">Privatization wins on random and on solid data</text>
<text x="40" y="76" class="t-subtitle" data-w="805">Measured on the author's GTX 1650, compute capability 7.5, CUDA 12.3, October 2026; one of 5 matching runs.</text>
<text x="40" y="144" class="t-head" data-w="195">Random values 0 to 255</text>
<g data-grid="skip">
<path d="M160,184V360M222,184V360M284,184V360M346,184V360M408,184V360" class="gridline"/>
<text x="160" y="380" text-anchor="middle" class="t-tick" data-w="8">0</text>
<text x="222" y="380" text-anchor="middle" class="t-tick" data-w="16">40</text>
<text x="284" y="380" text-anchor="middle" class="t-tick" data-w="16">80</text>
<text x="346" y="380" text-anchor="middle" class="t-tick" data-w="23">120</text>
<text x="408" y="380" text-anchor="middle" class="t-tick" data-w="23">160</text>
<g clip-path="url(#cuda-03-histogram-perf-clip-1)">
<rect x="160" y="216" width="20.93" height="24" class="f-red" data-fit="skip"/>
<rect x="160" y="304" width="181.66" height="24" class="f-green" data-fit="skip"/>
</g>
<path d="M408,184V360" class="s-ink-muted w1 nofill d-ref"/>
<path d="M160,184V360" class="axis"/>
<text x="402" y="176" text-anchor="end" class="t-note f-ink-muted" data-w="61">peak 160</text>
<text x="40" y="233" class="t-label" data-w="98">global atomics</text>
<text x="188.93" y="233" class="t-value f-red-ink" data-w="30">13.5</text>
<text x="40" y="321" class="t-label" data-w="66">privatized</text>
<text x="349.66" y="321" class="t-value f-green-ink" data-w="38">117.2</text>
</g>
<text x="284" y="404" text-anchor="middle" class="t-note" data-w="111">input read, GB/s</text>
<text x="40" y="444" class="t-head" data-w="217">privatized: 8.7 times faster</text>
<text x="496" y="144" class="t-head" data-w="223">Solid color, every value 128</text>
<g data-grid="skip">
<path d="M616,184V360M678,184V360M740,184V360M802,184V360M864,184V360" class="gridline"/>
<text x="616" y="380" text-anchor="middle" class="t-tick" data-w="8">0</text>
<text x="678" y="380" text-anchor="middle" class="t-tick" data-w="16">40</text>
<text x="740" y="380" text-anchor="middle" class="t-tick" data-w="16">80</text>
<text x="802" y="380" text-anchor="middle" class="t-tick" data-w="23">120</text>
<text x="864" y="380" text-anchor="middle" class="t-tick" data-w="23">160</text>
<g clip-path="url(#cuda-03-histogram-perf-clip-2)">
<rect x="616" y="216" width="10.23" height="24" class="f-red" data-fit="skip"/>
<rect x="616" y="304" width="66.81" height="24" class="f-green" data-fit="skip"/>
</g>
<path d="M864,184V360" class="s-ink-muted w1 nofill d-ref"/>
<path d="M616,184V360" class="axis"/>
<text x="858" y="176" text-anchor="end" class="t-note f-ink-muted" data-w="61">peak 160</text>
<text x="496" y="233" class="t-label" data-w="98">global atomics</text>
<text x="634.23" y="233" class="t-value f-red-ink" data-w="21">6.6</text>
<text x="496" y="321" class="t-label" data-w="66">privatized</text>
<text x="690.81" y="321" class="t-value f-green-ink" data-w="30">43.1</text>
</g>
<text x="740" y="404" text-anchor="middle" class="t-note" data-w="111">input read, GB/s</text>
<text x="496" y="444" class="t-head" data-w="217">privatized: 6.5 times faster</text>
<text x="40" y="504" class="t-note" data-w="611">Global atomics stay under 14 GB/s on either input; the private one reaches 43 to 117 GB/s.</text>
</svg>
