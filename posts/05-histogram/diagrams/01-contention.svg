<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-01-contention-title" aria-describedby="cuda-01-contention-desc">
<title id="cuda-01-contention-title">Atomics on one bin take turns</title>
<desc id="cuda-01-contention-desc">Left: eight threads, 0 to 7, each issue one atomicAdd on the same global bin, bins[128], over eight illustrative time slots. Thread k waits in red for k slots, adds in purple in slot k, and the bin's count steps from 1 to 8. Right: a table of the model's counts for 16,777,216 solid-color values: 16,777,216 atomics on the hottest global bin with global atomics; with privatization, 65,536 on one block's shared bin and 256 merges on the global bin.</desc>
