<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-04-warp-divergence-title" aria-describedby="cuda-04-warp-divergence-desc">
<title id="cuda-04-warp-divergence-title">A warp that splits runs both paths, one after the other</title>
<desc id="cuda-04-warp-divergence-desc">One warp of 32 lanes, lane 0 to lane 31. With no branch, all 32 lanes run in one pass, in orange. Branching on i mod 2 takes two passes: in pass 1 the 16 even lanes run doA() and the 16 odd lanes are idle, empty and outlined in red; in pass 2 the odd lanes run doB() and the even lanes are idle. A table gives the passes for one block of 256 threads, 8 warps: 8 with no branch, 16 branching on i mod 2, and 8 branching on (i / 32) mod 2, where whole warps agree.</desc>
