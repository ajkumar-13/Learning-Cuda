<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="cuda-03-thread-hierarchy-title" aria-describedby="cuda-03-thread-hierarchy-desc">
<title id="cuda-03-thread-hierarchy-title">Grid, block, warp, lane: where thread 773 lives</title>
<desc id="cuda-03-thread-hierarchy-desc">Top, the grid of one launch over N = 1000: 4 block cards, block 0 to block 3, each of 256 threads covering i = 0 to 255, 256 to 511, 512 to 767 and 768 to 1023; block 3 is emphasized. Middle, the hardware: 14 streaming multiprocessors, of which SM 0 to SM 3 each receive one block, drawn as arrows, and the other ten are idle. Bottom, block 3 opened on its SM into 8 rows of 32 lanes, one row per warp. Lane 5 of warp 0 is emphasized, and a card works its index: blockIdx.x 3 times blockDim.x 256 plus threadIdx.x 5 equals 773. The last 24 lanes of warp 7, i = 1000 to 1023, are empty and outlined in red: the surplus threads that fail the guard i &lt; N.</desc>
