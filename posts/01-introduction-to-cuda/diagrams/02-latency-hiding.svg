<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-02-latency-hiding-title" aria-describedby="cuda-02-latency-hiding-desc">
<title id="cuda-02-latency-hiding-title">Enough ready warps keep the scheduler busy</title>
<desc id="cuda-02-latency-hiding-desc">Two timelines of 32 cycles on one SM scheduler, with illustrative timings from snippets/thread_model.py: a warp issues 4 instructions in orange and then waits 12 cycles for its load, in green. With one warp, the scheduler row issues on 8 of the 32 cycles and is idle, in red, on the other 24: 25 percent busy. With four warps, each issues while the other three wait, and the scheduler row issues on all 32 cycles, numbered by the warp it serves: 100 percent busy.</desc>
