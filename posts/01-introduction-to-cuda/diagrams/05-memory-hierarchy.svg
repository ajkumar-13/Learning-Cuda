  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-green-ink { fill: var(--cuda-green-ink); }
  .f-green-soft { fill: var(--cuda-green-soft); }
  .s-green { stroke: var(--cuda-green); }
  .s-green-line { stroke: var(--cuda-green-line); }
</style>
<defs>
<marker id="cuda-05-memory-hierarchy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="747">Fast and private at the top, slow and GPU-wide at the bottom</text>
<text x="40" y="76" class="t-subtitle" data-w="739">Sizes measured by device_query on the GTX 1650 (compute capability 7.5), CUDA 12.3, October 2026.</text>
<text x="920" y="120" text-anchor="end" class="t-tick" data-w="116">latency, illustrative</text>
<rect x="168" y="136" width="400" height="72" rx="8" class="f-green-soft s-green-line w1"/>
<text x="184" y="168" class="t-head" data-w="78">Registers</text>
<text x="184" y="192" class="t-note" data-w="179">one thread; 65,536 per SM</text>
<text x="920" y="180" text-anchor="end" class="t-label" data-w="89">about 1 cycle</text>
<rect x="168" y="220" width="464" height="72" rx="8" class="f-green-soft s-green-line w1"/>
<text x="184" y="252" class="t-head" data-w="129">Shared memory</text>
<text x="184" y="276" class="t-note" data-w="305">one block, on chip beside L1; 48 KB per block</text>
<rect x="168" y="220" width="464" height="72" rx="8" class="emph s-green" data-fit="skip"/>
<text x="648" y="252" class="t-label f-green-ink" data-w="154">managed by the kernel</text>
<rect x="168" y="304" width="528" height="72" rx="8" class="f-green-soft s-green-line w1"/>
<text x="184" y="336" class="t-head" data-w="73">L2 cache</text>
<text x="184" y="360" class="t-note" data-w="170">the whole GPU; 1,024 KB</text>
<rect x="168" y="388" width="592" height="72" rx="8" class="f-green-soft s-green-line w1"/>
<text x="184" y="420" class="t-head" data-w="194">Global memory (DRAM)</text>
<text x="184" y="444" class="t-note" data-w="225">the whole GPU, off chip; 4.00 GiB</text>
<text x="920" y="432" text-anchor="end" class="t-label" data-w="126">hundreds of cycles</text>
<path d="M96,428 L96,171" class="flow" marker-end="url(#cuda-05-memory-hierarchy-arrow)"/>
<text x="40" y="148" class="t-tick" data-w="99">faster, narrower</text>
<text x="40" y="456" class="t-tick" data-w="82">slower, wider</text>
<text x="40" y="504" class="t-note" data-w="551">Inputs and outputs live at the bottom; fast kernels bring data up once and reuse it.</text>
</svg>
