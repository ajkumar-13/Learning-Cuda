<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-05-memory-hierarchy-title" aria-describedby="cuda-05-memory-hierarchy-desc">
<title id="cuda-05-memory-hierarchy-title">Fast and private at the top, slow and GPU-wide at the bottom</title>
<desc id="cuda-05-memory-hierarchy-desc">A ladder of four green memory tiers that widen downward, with the size of each on the GTX 1650 as device_query reports it. Registers: one thread, 65,536 32-bit registers per SM, about 1 cycle. Shared memory, emphasized as the tier the kernel manages by hand: one block, on chip beside the L1 cache, 48 KB per block. L2 cache: the whole GPU, 1,024 KB. Global memory, off-chip DRAM: the whole GPU, 4.00 GiB, hundreds of cycles. An arrow on the left points up, from slower and wider in scope to faster and narrower. The two latencies are illustrative.</desc>
<style>
