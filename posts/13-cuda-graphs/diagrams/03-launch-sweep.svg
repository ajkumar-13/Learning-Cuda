<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-03-launch-sweep-title" aria-describedby="cuda-03-launch-sweep-desc">
<title id="cuda-03-launch-sweep-title">A graph pays off only for kernels a few µs long</title>
<desc id="cuda-03-launch-sweep-desc">Speedup of graph replay over direct launches against kernel length W from 0 to 32 µs. Measured points: 2.34 at 0, 1.25 at 2, 1.15 at 4, 1.06 at 8, 1.04 at 16 and 1.02 at 32 µs. The dashed model curve, from L of 1.54 µs and l of 0.81 µs per kernel over 10,000 kernels, starts at 1.89, passes through the other points and crosses the 1.1 line at 6.4 µs.</desc>
