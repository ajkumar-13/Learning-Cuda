<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-02-graph-capture-title" aria-describedby="cuda-02-graph-capture-desc">
<title id="cuda-02-graph-capture-title">Capture records the stream as a graph, built once</title>
<desc id="cuda-02-graph-capture-desc">Left: the capture code of graphs.cu, cudaStreamBeginCapture, twenty launches, cudaStreamEndCapture and cudaGraphInstantiate. Middle: the graph it records, kernel 1 to kernel 20 joined by dependency edges in stream order. Right: instantiation costs 59.9 µs once; each cudaGraphLaunch then issues all twenty kernels for 0.28 µs of host time per kernel. Bottom: a captured poolRoundTrip becomes three nodes, cudaMallocAsync, the kernel and cudaFreeAsync.</desc>
<style>
