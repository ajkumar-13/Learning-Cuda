<text x="40" y="48" class="t-title" data-w="664">A barrier must be reached by every thread of the block</text>
<text x="40" y="76" class="t-subtitle" data-w="622">Eight threads stand for a block; the branch t &lt; 4 stands for the post's threadIdx.x &lt; 32.</text>
