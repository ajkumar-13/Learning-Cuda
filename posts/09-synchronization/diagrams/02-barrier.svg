<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-02-barrier-title" aria-describedby="cuda-02-barrier-desc">
<title id="cuda-02-barrier-title">A barrier must be reached by every thread of the block</title>
<desc id="cuda-02-barrier-desc">Two panels, each a block of eight threads on a time axis. Left: threads 0 to 3 take the branch if (t &lt; 4), do its work and stop at a purple __syncthreads() bar inside it, then wait, drawn red; threads 4 to 7 skip the branch and never reach that barrier, so the outcome is undefined: the block can hang, or pass with its phases paired wrongly. Right: the barrier after the branch spans all eight threads; all arrive, then all continue.</desc>
