<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-03-fence-acquire-release-title" aria-describedby="cuda-03-fence-acquire-release-desc">
<title id="cuda-03-fence-acquire-release-title">Fence before the flag, fence after it</title>
<desc id="cuda-03-fence-acquire-release-desc">Two timelines of six time slots, each with a writer thread in block 0, the data and flag as block 1 sees them, and a reader thread in block 1. Top, no fences: the writer stores data = 42 in slot 1 and flag = 1 in slot 2, but block 1 sees the flag first (data 0, flag 1), so the reader sees flag 1 in slot 3 and reads the stale data 0 in slot 4, in red; data 42 arrives in slot 5. Bottom: the writer stores data = 42, fences (release) and stores flag = 1; the reader sees flag 1, fences (acquire) and reads data 42.</desc>
