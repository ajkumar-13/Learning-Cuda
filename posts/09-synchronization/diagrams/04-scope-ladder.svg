<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-04-scope-ladder-title" aria-describedby="cuda-04-scope-ladder-desc">
<title id="cuda-04-scope-ladder-title">A wider scope orders more threads and costs more</title>
<desc id="cuda-04-scope-ladder-desc">Top, a table of the three scopes from narrowest to widest: block, with __threadfence_block() and atomicAdd_block, reaches the threads of one block; device, with __threadfence() and atomicAdd, every thread of the GPU; system, with __threadfence_system() and atomicAdd_system, also host threads and peer GPUs. Bottom, a bar chart of nanoseconds per iteration of a store-then-fence loop: no fence 39, block 166, device 328, system 2,919.</desc>
