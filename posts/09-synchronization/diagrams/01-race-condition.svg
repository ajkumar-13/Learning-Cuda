<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-01-race-condition-title" aria-describedby="cuda-01-race-condition-desc">
<title id="cuda-01-race-condition-title">Two threads add one each; the counter gains one</title>
<desc id="cuda-01-race-condition-desc">Two timelines of six time slots, each with rows for thread 0, the shared counter and thread 1. Top, a plain counter += 1: thread 0 reads 7 in slot 1, thread 1 reads 7 in slot 2, both compute 8, thread 0 writes 8 in slot 5 and thread 1 writes 8 in slot 6; the counter reads 7, 7, 7, 7, 8, 8 and ends at 8, not 9, the second write in red as the lost update. Bottom, atomicAdd: thread 0's indivisible add takes the counter from 7 to 8 in slots 1 to 3 while thread 1 waits, then thread 1's takes it to 9 in slots 4 to 6.</desc>
