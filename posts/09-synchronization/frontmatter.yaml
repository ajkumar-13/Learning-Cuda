code: included
outcomes:
  - id: o1
    text: "Explain the lost-update race of a plain read-modify-write, and use the race model to count what each schedule loses."
  - id: o2
    text: "Place `__syncthreads()` where every thread of the block reaches it, and say why a barrier inside divergent code is undefined."
  - id: o3
    text: "Order the lanes of one warp: a `_sync` primitive with a mask derived from the program's logic, or `__syncwarp()` between shared-memory reads and writes."
  - id: o4
    text: "Use `atomicAdd` and `atomicCAS`, and separate what an atomic guarantees (no lost update) from what it does not (the order of other writes)."
  - id: o5
    text: "Publish data to other threads with a fence or an acquire-release atomic at the narrowest scope that reaches them: block, device, or system."
  - id: o6
    text: "Explain why no barrier spans the grid inside an ordinary kernel, and why a new launch is the grid-wide barrier."
