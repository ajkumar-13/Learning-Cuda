title: "09 - When threads share data: barriers, atomics, and the memory model"
summary: "What a block barrier, a warp's sync primitives, an atomic and a memory fence each guarantee when threads share data, from the lost update to fence scopes, and why only a new launch synchronizes the whole grid."
date: 2026-07-16
updated: 2026-10-18
