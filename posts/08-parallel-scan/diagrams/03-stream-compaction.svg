<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="cuda-03-stream-compaction-title" aria-describedby="cuda-03-stream-compaction-desc">
<title id="cuda-03-stream-compaction-title">An exclusive scan tells each survivor where to go</title>
<desc id="cuda-03-stream-compaction-desc">Four rows for 9 values. Input: 3 −1 7 0 −2 4 1 −5 6. Predicate, 1 for a positive value: 1 0 1 0 0 1 1 0 1. Exclusive scan of the predicate: 0 1 1 2 2 2 3 4 4. Orange arrows scatter each kept input to the output index its scan gives, filling 3 7 4 1 6: 5 of 9 kept, in order, with no gaps. Dropped elements are drawn neutral.</desc>
