<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-04-scan-perf-title" aria-describedby="cuda-04-scan-perf-desc">
<title id="cuda-04-scan-perf-title">Only the one-pass library scan reaches the copy</title>
<desc id="cuda-04-scan-perf-desc">A horizontal bar chart of bandwidth, the 8 N bytes a scan must move divided by its time, for a scan of 16,777,216 floats on the author's GTX 1650. Hillis-Steele in shared memory 33.8 GB/s, Blelloch with plain indices 27.9 (red: bank conflicts), Blelloch conflict-free 39.6, warp shuffle 57.4, CUB 139.6. Dotted lines mark the copy kernel's 140.2 GB/s and half of it, 70.1, the most a three-phase scan can show.</desc>
