<text x="548" y="472" text-anchor="middle" class="t-note" data-w="309">effective bandwidth, 8N bytes over time, GB/s</text>
<text x="40" y="504" class="t-note" data-w="642">A three-phase scan reads and writes the array twice, so it can show at most half the copy's rate.</text>
