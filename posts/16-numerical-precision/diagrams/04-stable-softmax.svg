<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-04-stable-softmax-title" aria-describedby="cuda-04-stable-softmax-desc">
<title id="cuda-04-stable-softmax-title">Subtracting the maximum keeps every value finite</title>
<desc id="cuda-04-stable-softmax-desc">Two rows of four-cell strips for the scores 2, 3, 1000, 1001 in FP32. Naive: exp gives 7.389, 20.09, inf, inf, the sum is inf, and the division gives 0, 0, nan, nan, drawn red. Stable: subtracting the maximum 1001 gives minus 999, minus 998, minus 1 and 0; exp gives 0, 0, 0.3679 and 1; the sum is 1.3679 and the division gives 0, 0, 0.2689 and 0.7311, drawn green.</desc>
