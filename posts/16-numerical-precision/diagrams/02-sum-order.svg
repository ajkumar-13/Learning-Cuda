<path d="M330.4,280 L330.4,296" class="s-ink-muted w1 nofill d-ref"/>
</g>
<text x="332" y="348" text-anchor="middle" class="t-note" data-w="141">halfway, 100,000,004</text>
<path d="M252,264 V256 H408.8 V264" class="brace"/>
<g data-grid="skip">
<text x="330.4" y="248" text-anchor="middle" class="t-note" data-w="65">spacing 8</text>
</g>
<g data-grid="skip">
<circle cx="271.6" cy="288" r="5" class="nofill s-red w15"/>
</g>
<text x="272" y="184" text-anchor="middle" class="t-label f-red-ink" data-w="122">exact 100,000,001</text>
<path d="M272,196 L272,277" class="s-red w15 nofill" marker-end="url(#cuda-02-sum-order-arrow-red)"/>
<text x="40" y="404" class="t-note" data-w="362">100,000,001 is within 4 of 100,000,000: it rounds there</text>
<text x="496" y="120" class="t-head" data-w="310">One sum of 1,048,576 floats, abs error</text>
<g data-grid="skip">
<path d="M592,160V392M658,160V392M724,160V392M790,160V392M856,160V392" class="gridline"/>
