</g>
<path d="M757,160V392" class="s-ink-muted w1 nofill d-ref"/>
<path d="M592,160V392" class="axis"/>
<text x="763" y="152" class="t-note f-ink-muted" data-w="135">one spacing, 0.0625</text>
<text x="496" y="194" class="t-label" data-w="48">1 block</text>
<text x="707.18" y="194" class="t-value f-ink" data-w="47">0.0406</text>
<text x="496" y="252" class="t-label" data-w="64">14 blocks</text>
<text x="657.82" y="252" class="t-value f-ink" data-w="47">0.0219</text>
<text x="496" y="310" class="t-label" data-w="64">56 blocks</text>
<text x="707.18" y="310" class="t-value f-ink" data-w="47">0.0406</text>
<text x="496" y="368" class="t-label" data-w="72">224 blocks</text>
<text x="822.82" y="368" class="t-value f-ink" data-w="47">0.0844</text>
</g>
<text x="724" y="436" text-anchor="middle" class="t-note" data-w="340">absolute error; one CPU loop: 2.9594, off the scale</text>
<text x="40" y="504" class="t-note" data-w="550">A term below half a spacing vanishes; each block count rounds at different places.</text>
</svg>
