<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-02-sum-order-title" aria-describedby="cuda-02-sum-order-desc">
<title id="cuda-02-sum-order-title">Every addition rounds to a neighbor</title>
<desc id="cuda-02-sum-order-desc">Two panels. Left: the FP32 number line near 10 to the 8, where the neighbors 99,999,992, 100,000,000 and 100,000,008 are 8 apart; the exact sum 100,000,001 lies within half a spacing, 4, of 100,000,000 and rounds back to it, so the 1 is lost. Right: bars of the absolute error of one FP32 sum of 1,048,576 floats with 1, 14, 56 and 224 blocks of 256 threads: 0.0406, 0.0219, 0.0406 and 0.0844, against one FP32 spacing of 0.0625 near the sum, drawn as a reference line; a single CPU loop is off the scale at 2.9594.</desc>
<style>
