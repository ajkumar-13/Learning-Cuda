</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="438">Every addition rounds to a neighbor</text>
<text x="40" y="76" class="t-subtitle" data-w="725">Block-count errors run on the author's GTX 1650 (compute capability 7.5), CUDA 12.3, October 2026.</text>
<text x="40" y="120" class="t-head" data-w="259">FP32 numbers near 100,000,000</text>
