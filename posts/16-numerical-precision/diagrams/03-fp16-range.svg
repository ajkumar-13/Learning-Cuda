<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-03-fp16-range-title" aria-describedby="cuda-03-fp16-range-desc">
<title id="cuda-03-fp16-range-title">FP16 holds about 12 decades; BF16 holds FP32's</title>
<desc id="cuda-03-fp16-range-desc">Three rows on a logarithmic axis from 10 to the minus 9 to 10 to the 6. FP16: normal numbers from 6.1 times 10 to the minus 5 to 65,504, a solid green band, and subnormal numbers down to 6.0 times 10 to the minus 8, a dashed band. BF16 and FP32: normal numbers across the whole axis and far past both ends. The values 10 to the minus 8, 10 to the minus 5 and 100,000 are marked on each row; on the FP16 row 100,000 becomes inf and 10 to the minus 8 becomes 0, red diamonds, and 10 to the minus 5 is kept as a subnormal, a hollow circle.</desc>
<style>
