<text x="648" y="228" class="t-code f-red-ink" data-w="18">t0</text>
<path d="M776,248 L776,195" class="s-red w15 nofill" marker-end="url(#cuda-01-fusion-traffic-arrow-red)"/>
<path d="M864,192 L864,245" class="s-green w15 nofill" marker-end="url(#cuda-01-fusion-traffic-arrow-green)"/>
<text x="768" y="228" text-anchor="end" class="t-code f-red-ink" data-w="18">t0</text>
<text x="872" y="228" class="t-code f-green-ink" data-w="9">z</text>
