<marker id="cuda-01-fusion-traffic-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="f-green"/></marker>
<marker id="cuda-01-fusion-traffic-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="f-red"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="550">Fusion deletes the intermediates' round trips</text>
<text x="40" y="76" class="t-subtitle" data-w="699">Derived by fusion_model.py for 16,777,216 floats (67.1 MB per array) and a chain of 4 operations.</text>
<text x="40" y="128" class="t-head" data-w="390">Separate: 4 launches, 8 arrays moved, 536.9 MB</text>
