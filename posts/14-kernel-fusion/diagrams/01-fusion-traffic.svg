<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-01-fusion-traffic-title" aria-describedby="cuda-01-fusion-traffic-desc">
<title id="cuda-01-fusion-traffic-title">Fusion deletes the intermediates' round trips</title>
<desc id="cuda-01-fusion-traffic-desc">Two rows over a green band of global memory. Top: four separate kernels, bias, scale, ReLU and GELU, in a row; each reads a whole array from global memory and writes one back. The first reads x and the last writes z; the three intermediates between them are written and read back, drawn red. Eight arrays of 67.1 MB move, 536.9 MB in all. Bottom: one fused kernel keeps the value in a register through the four operations, reads x once and writes z once, 134.2 MB, a quarter of the traffic.</desc>
