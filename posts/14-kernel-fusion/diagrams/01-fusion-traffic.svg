  .arrowhead { fill: var(--cuda-arrow); }
  .emph { fill: none; stroke-width: 2.5; }
  .w1 { stroke-width: 1; }
  .w15 { stroke-width: 1.5; }
  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-green { fill: var(--cuda-green); }
  .f-green-ink { fill: var(--cuda-green-ink); }
  .f-green-soft { fill: var(--cuda-green-soft); }
  .f-orange-soft { fill: var(--cuda-orange-soft); }
  .f-red { fill: var(--cuda-red); }
  .f-red-ink { fill: var(--cuda-red-ink); }
  .s-green { stroke: var(--cuda-green); }
  .s-green-line { stroke: var(--cuda-green-line); }
  .s-orange-line { stroke: var(--cuda-orange-line); }
  .s-red { stroke: var(--cuda-red); }
</style>
