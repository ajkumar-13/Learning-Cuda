<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-03-register-pressure-title" aria-describedby="cuda-03-register-pressure-desc">
<title id="cuda-03-register-pressure-title">Above 64 registers per thread, occupancy falls</title>
<desc id="cuda-03-register-pressure-desc">A step curve of theoretical occupancy against registers per thread, 1 to 255, for 256-thread blocks on compute capability 7.5: 100% up to 64 registers, 75% from 65 to 80, 50% from 81 to 128, 25% from 129. Orange marks: the fused elementwise chain at 10 registers and the tiled matrix multiplication at 39, both at 100%. Red marks: 65 registers at 75% and 128 at 50%.</desc>
