<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-02-fusion-perf-title" aria-describedby="cuda-02-fusion-perf-desc">
<title id="cuda-02-fusion-perf-title">Fused, the chain costs one pass over memory</title>
<desc id="cuda-02-fusion-perf-desc">Left: horizontal bars of time in milliseconds for an elementwise chain over 16,777,216 floats. Two operations: separate 1.886, fused 0.943. Three: 2.849 and 0.950. Four: 3.811 and 0.965. Separate bars are red, fused bars ink. Right: the median time a ReLU adds to the tiled 1,024 cubed matrix multiplication (6.8 ms alone): 0.113 ms as a separate kernel after it, in red, and 0.007 ms in its epilogue, in ink.</desc>
<style>
