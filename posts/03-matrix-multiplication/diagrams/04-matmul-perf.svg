<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="cuda-04-matmul-perf-title" aria-describedby="cuda-04-matmul-perf-desc">
<title id="cuda-04-matmul-perf-title">Tiling lifts the naive kernel; cuBLAS is far beyond both</title>
<desc id="cuda-04-matmul-perf-desc">Four horizontal bar charts on one scale from 0 to 2,500 GFLOP/s, one per square size, each with three bars: the naive kernel (orange), the tiled kernel with TILE 16 (orange as well) and cuBLAS (ink). At 256 cubed: naive 214, tiled 328, cuBLAS 919. At 512 cubed: naive 227, tiled 330, cuBLAS 1,502. At 1,024 cubed: naive 196, tiled 305, cuBLAS 2,189. At 2,048 cubed: naive 159, tiled 222, cuBLAS 1,727.</desc>
<style>
