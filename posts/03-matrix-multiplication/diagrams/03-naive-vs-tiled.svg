<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="cuda-03-naive-vs-tiled-title" aria-describedby="cuda-03-naive-vs-tiled-desc">
<title id="cuda-03-naive-vs-tiled-title">Naive re-reads global memory; tiled loads once per block</title>
<desc id="cuda-03-naive-vs-tiled-desc">Left, the naive kernel: four threads computing elements 0 to 3 of row 2 of C each read the whole of row 2 of A from global memory, drawn as four red arrows to the same green row: 128 loads per output at K = 64, 524,288 in all. Right, the tiled kernel: a tile of A and a tile of B in global memory are loaded once, one element per thread, into the shared-memory tiles s_A and s_B; a purple __syncthreads() bar marks that the tiles are loaded; the threads then do TILE multiply-adds from shared memory; a second purple bar marks that every thread is done before the next load; an arrow loops back to the next tile. 8 loads per output, 32,768 in all, 16 times fewer.</desc>
