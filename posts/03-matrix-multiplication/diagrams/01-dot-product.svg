<text x="136" y="356" text-anchor="end" class="t-code" data-w="9">A</text>
<text x="136" y="380" text-anchor="end" class="t-code" data-w="52">[M, K]</text>
<text x="352" y="140" text-anchor="end" class="t-code" data-w="9">B</text>
<text x="352" y="164" text-anchor="end" class="t-code" data-w="52">[K, N]</text>
<text x="528" y="428" class="t-code" data-w="9">C</text>
<text x="528" y="452" class="t-code" data-w="52">[M, N]</text>
<text x="136" y="400" text-anchor="end" class="t-tick" data-w="35">row 2</text>
<text x="476" y="112" text-anchor="middle" class="t-tick" data-w="30">col 4</text>
<path d="M344,396 L464,396" class="lead"/>
<path d="M476,312 L476,384" class="lead"/>
<rect x="560" y="120" width="360" height="132" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="576" y="152" class="t-head" data-w="196">thread (row, col) = (2, 4)</text>
<text x="576" y="184" class="t-code13" data-w="215">for (int k = 0; k &lt; K; ++k)</text>
<text x="592" y="208" class="t-code13" data-w="310">sum += A[row * K + k] * B[k * N + col];</text>
<text x="576" y="232" class="t-code13" data-w="183">C[row * N + col] = sum;</text>
<text x="560" y="300" class="t-math" data-w="119"><tspan class="i">C</tspan><tspan class="sub i" dy="4">ij</tspan><tspan dy="-4">​</tspan> = <tspan class="big">Σ</tspan><tspan class="sub i" dx="-10.67" dy="13">k</tspan><tspan dx="5.17" dy="-13">​</tspan> <tspan class="i">A</tspan><tspan class="sub i" dy="4">ik</tspan><tspan dy="-4">​</tspan> <tspan class="i">B</tspan><tspan class="sub i" dy="4">kj</tspan><tspan dy="-4">​</tspan></text>
<text x="560" y="352" class="t-note" data-w="233">K multiply-adds and 2K loads from</text>
<text x="560" y="372" class="t-note" data-w="217">global memory per element of C</text>
<text x="40" y="504" class="t-note" data-w="535">The grid supplies the loop over (row, col); each thread runs only the loop over k.</text>
</svg>
