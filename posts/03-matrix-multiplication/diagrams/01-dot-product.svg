<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-01-dot-product-title" aria-describedby="cuda-01-dot-product-desc">
<title id="cuda-01-dot-product-title">One thread, one output: a row of A meets a column of B</title>
<desc id="cuda-01-dot-product-desc">Three grids in the multiply layout: A, shape M by K, drawn 5 by 8 at the lower left; B, shape K by N, drawn 8 by 6 above C; C, shape M by N, drawn 5 by 6 at the lower right. Row 2 of A and column 4 of B are shaded green, and dashed leaders run from them to cell (2, 4) of C, shaded orange: the one thread that computes it. A card on the right shows that thread's loop line from matmul.cu, sum += A[row * K + k] * B[k * N + col], and the sum C sub ij equals the sum over k of A sub ik times B sub kj: K multiply-adds and 2K loads per output element.</desc>
