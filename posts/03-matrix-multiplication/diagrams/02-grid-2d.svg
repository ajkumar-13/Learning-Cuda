<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-02-grid-2d-title" aria-describedby="cuda-02-grid-2d-desc">
<title id="cuda-02-grid-2d-title">A 2D grid of 16 × 16 blocks: every thread finds (row, col)</title>
<desc id="cuda-02-grid-2d-desc">Left, the top-left corner of the grid over a 1,000 by 1,000 output C: block cells in 4 rows (blockIdx.y 0 to 3) and 5 columns (blockIdx.x 0 to 4), with block (2, 1) emphasized; the full grid is 63 by 63 blocks. Middle, that block opened into 16 by 16 threads, with thread (5, 3) emphasized. Right, a card works its index: row = blockIdx.y 1 times blockDim.y 16 plus threadIdx.y 3 = 19, col = blockIdx.x 2 times blockDim.x 16 plus threadIdx.x 5 = 37. A note says the 63 by 63 grid launches 1,016,064 threads for 1,000,000 outputs, so 16,064 fail the guard.</desc>
