  .arrowhead { fill: var(--cuda-arrow); }
  .emph { fill: none; stroke-width: 2.5; }
  .w1 { stroke-width: 1; }
  .w15 { stroke-width: 1.5; }
  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-blue-soft { fill: var(--cuda-blue-soft); }
  .f-orange-soft { fill: var(--cuda-orange-soft); }
  .s-blue { stroke: var(--cuda-blue); }
  .s-blue-line { stroke: var(--cuda-blue-line); }
  .s-ink-muted { stroke: var(--cuda-ink-muted); }
  .s-orange { stroke: var(--cuda-orange); }
  .s-orange-line { stroke: var(--cuda-orange-line); }
</style>
<defs>
<marker id="cuda-01-profiling-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="555">Check before timing, and again after every fix</text>
<text x="40" y="76" class="t-subtitle" data-w="612">SAXPY on the author's GTX 1650, compute capability 7.5, CUDA 12.3, October 2026.</text>
<rect x="40" y="144" width="160" height="144" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="56" y="176" class="t-head" data-w="64">1. Write</text>
<text x="56" y="208" class="t-label" data-w="67">the kernel</text>
<text x="56" y="268" class="t-code" data-w="43">saxpy</text>
<rect x="220" y="144" width="160" height="144" rx="8" class="card"/>
<text x="236" y="176" class="t-head" data-w="70">2. Check</text>
<text x="236" y="208" class="t-label" data-w="102">memcheck and</text>
<text x="236" y="232" class="t-label" data-w="68">racecheck</text>
<text x="236" y="268" class="t-value" data-w="56">0 errors</text>
<rect x="400" y="144" width="160" height="144" rx="8" class="f-blue-soft s-blue-line w1"/>
<text x="416" y="176" class="t-head" data-w="90">3. Measure</text>
<text x="416" y="208" class="t-label" data-w="91">CUDA events</text>
<text x="416" y="268" class="t-value" data-w="79">145.2 GB/s</text>
<rect x="580" y="144" width="160" height="144" rx="8" class="card"/>
<text x="596" y="176" class="t-head" data-w="61">4. Read</text>
<text x="596" y="208" class="t-label" data-w="102">memory bound</text>
<text x="596" y="268" class="t-value" data-w="105">91% of its roof</text>
<rect x="760" y="144" width="160" height="144" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="776" y="176" class="t-head" data-w="44">5. Fix</text>
<text x="776" y="208" class="t-label" data-w="71">one limiter</text>
<text x="776" y="268" class="t-label" data-w="112">and nothing else</text>
<path d="M200,216 L217,216" class="flow" marker-end="url(#cuda-01-profiling-loop-arrow)"/>
<path d="M380,216 L397,216" class="flow" marker-end="url(#cuda-01-profiling-loop-arrow)"/>
<path d="M560,216 L577,216" class="flow" marker-end="url(#cuda-01-profiling-loop-arrow)"/>
<path d="M740,216 L757,216" class="flow" marker-end="url(#cuda-01-profiling-loop-arrow)"/>
<path d="M840,288 L840,344 L300,344 L300,291" class="flow" marker-end="url(#cuda-01-profiling-loop-arrow)"/>
<text x="568" y="372" text-anchor="middle" class="t-note" data-w="272">every fix is checked and measured again</text>
<rect x="40" y="420" width="16" height="16" class="f-orange-soft s-orange w1"/>
<text x="72" y="432" class="t-label" data-w="67">the kernel</text>
<rect x="168" y="420" width="16" height="16" class="f-blue-soft s-blue w1"/>
<text x="200" y="432" class="t-label" data-w="161">measured on the device</text>
<rect x="392" y="420" width="16" height="16" class="s-ink-muted w15 nofill"/>
<text x="424" y="432" class="t-label" data-w="165">the check and the model</text>
<text x="40" y="504" class="t-note" data-w="678">Nsight Systems and Nsight Compute belong to steps 3 and 4; both needed administrator rights here.</text>
</svg>
