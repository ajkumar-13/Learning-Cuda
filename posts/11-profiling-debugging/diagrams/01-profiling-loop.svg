<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-01-profiling-loop-title" aria-describedby="cuda-01-profiling-loop-desc">
<title id="cuda-01-profiling-loop-title">Check before timing, and again after every fix</title>
<desc id="cuda-01-profiling-loop-desc">A loop of five cards from left to right. 1, write: the kernel, saxpy. 2, check: memcheck and racecheck, 0 errors. 3, measure: CUDA events, 145.2 GB/s. 4, read the bottleneck: memory bound, 91% of its roofline ceiling. 5, fix: one limiter and nothing else. An arrow runs from the fix back under the row to the check, labeled: every fix is checked and measured again. Orange marks the kernel, blue the measurement on the device, neutral the check and the model.</desc>
<style>
