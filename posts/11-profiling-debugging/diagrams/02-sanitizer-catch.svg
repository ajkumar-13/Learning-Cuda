<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-02-sanitizer-catch-title" aria-describedby="cuda-02-sanitizer-catch-desc">
<title id="cuda-02-sanitizer-catch-title">Without the guard, two threads run past the end</title>
<desc id="cuda-02-sanitizer-catch-desc">Eight threads in two blocks of four, i from 0 to 7, above an array of 6 floats, 24 bytes, standing for each of A, B and C. Threads 0 to 5 reach elements 0 to 5. Threads 6 and 7, thread 2 and thread 3 of block 1, reach past the end into a dashed red region at bytes 24 and 28, which memcheck reports as invalid __global__ reads by thread (2,0,0) and thread (3,0,0) in block (1,0,0).</desc>
