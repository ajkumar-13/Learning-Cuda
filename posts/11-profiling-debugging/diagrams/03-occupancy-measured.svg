<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-03-occupancy-measured-title" aria-describedby="cuda-03-occupancy-measured-desc">
<title id="cuda-03-occupancy-measured-title">Only the one-warp blocks lose occupancy and bandwidth</title>
<desc id="cuda-03-occupancy-measured-desc">Left: occupancy in percent against threads per block, 32, 64, 128, 256, 512 and 1,024. Post 10's model, hollow circles, and the CUDA runtime's theoretical occupancy, squares, agree: 50% at 32 and 100% from 64 up. Right: measured bandwidth, 107.4 GB/s at 32 threads per block, in red, and 145.3, 145.2, 145.1, 145.2 and 145.3 GB/s from 64 to 1,024, on an axis that ends at the 160 GB/s peak.</desc>
