<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-03-halo-tile-title" aria-describedby="cuda-03-halo-tile-desc">
<title id="cuda-03-halo-tile-title">The tile loads a halo one pixel wide</title>
<desc id="cuda-03-halo-tile-desc">An 18 by 18 tile in shared memory, s, for a 16 by 16 output tile and a 3 by 3 filter. The inner 16 by 16 cells, orange, are the 256 threads that load a pixel and compute an output; the one-pixel ring around them, red-edged, is the halo: 68 threads that load a pixel from the neighboring tiles and then idle. Step 1, all 324 threads load; a barrier; step 2, the inner threads compute. A table gives naive against tile reads: 3 by 3, 2,304 against 324, 7.1 times; 5 by 5, 6,400 against 400, 16.0 times; 7 by 7, 12,544 against 484, 25.9 times.</desc>
