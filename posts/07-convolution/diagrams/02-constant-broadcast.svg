<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="cuda-02-constant-broadcast-title" aria-describedby="cuda-02-constant-broadcast-desc">
<title id="cuda-02-constant-broadcast-title">Constant memory serves one address per request</title>
<desc id="cuda-02-constant-broadcast-desc">Top: the 32 lanes of a warp all read the filter weight c_mask[4] at the same moment; the constant cache serves the one address with one request, broadcast to every lane. Bottom: if the warp read its 32 pixels, 32 different addresses, from constant memory, the read would split into 32 requests served one after another. Constant memory is 64 KB on the device, with an 8 KB cache working set per SM on compute capability 7.5.</desc>
