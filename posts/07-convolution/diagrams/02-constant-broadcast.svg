<text x="112" y="616" class="t-label f-red-ink b" data-w="266">32 requests, served one after another</text>
<text x="112" y="644" class="t-note" data-w="650">Constant memory: 64 KB per device, an 8 KB cache working set per SM (compute capability 7.5).</text>
<text x="40" y="684" class="t-note" data-w="570">The filter suits constant memory: every lane reads the same weight at the same time.</text>
