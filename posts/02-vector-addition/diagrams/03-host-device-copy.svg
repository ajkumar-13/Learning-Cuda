<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="716">Two memories, six steps, and a narrow road between them</text>
<text x="40" y="76" class="t-subtitle" data-w="725">Bandwidths measured on the author's GTX 1650 (compute capability 7.5), CUDA 12.3, October 2026.</text>
<text x="40" y="128" class="t-head f-blue-ink" data-w="83">host: CPU</text>
<rect x="40" y="144" width="288" height="72" rx="8" class="f-blue-soft s-blue-line w1"/>
<text x="56" y="176" class="t-head" data-w="111">host program</text>
<text x="56" y="208" class="t-label" data-w="112">runs steps 1 to 6</text>
<rect x="40" y="256" width="160" height="48" rx="8" class="f-green-soft s-green-line w1"/>
<text x="56" y="288" class="t-code" data-w="26">h_A</text>
<rect x="40" y="312" width="160" height="48" rx="8" class="f-green-soft s-green-line w1"/>
<text x="56" y="344" class="t-code" data-w="26">h_B</text>
<rect x="40" y="408" width="160" height="48" rx="8" class="f-green-soft s-green-line w1"/>
<text x="56" y="440" class="t-code" data-w="26">h_C</text>
<text x="40" y="476" class="t-note" data-w="88">host memory</text>
<path d="M456,112 L456,460" class="s-purple w15 nofill d-proj"/>
<text x="448" y="380" text-anchor="end" class="t-label f-purple-ink" data-w="126">PCIe 3.0, 16 lanes:</text>
<text x="448" y="400" text-anchor="end" class="t-label f-purple-ink" data-w="212">11.6 GB/s pinned, 3.5 pageable</text>
<text x="600" y="128" class="t-head f-orange-ink" data-w="100">device: GPU</text>
<rect x="600" y="256" width="104" height="48" rx="8" class="f-green-soft s-green-line w1"/>
<text x="616" y="288" class="t-code" data-w="26">d_A</text>
<rect x="600" y="312" width="104" height="48" rx="8" class="f-green-soft s-green-line w1"/>
<text x="616" y="344" class="t-code" data-w="26">d_B</text>
<rect x="600" y="408" width="104" height="48" rx="8" class="f-green-soft s-green-line w1"/>
<text x="616" y="440" class="t-code" data-w="26">d_C</text>
<text x="600" y="476" class="t-note" data-w="228">global memory: 1. allocate, 6. free</text>
<rect x="776" y="256" width="144" height="200" rx="8" class="f-orange-soft s-orange-line w1"/>
<text x="792" y="288" class="t-head" data-w="85">vectorAdd</text>
<text x="792" y="320" class="t-label" data-w="52">thread i</text>
<text x="792" y="344" class="t-label" data-w="67">writes C[i]</text>
<text x="792" y="384" class="t-value f-orange-ink" data-w="79">145.0 GB/s</text>
<text x="792" y="408" class="t-note" data-w="118">to global memory</text>
<path d="M200,280 L597,280" class="flow" marker-end="url(#cuda-03-host-device-copy-arrow)"/>
<text x="216" y="272" class="t-label" data-w="65">2. copy in</text>
<path d="M200,336 L597,336" class="flow" marker-end="url(#cuda-03-host-device-copy-arrow)"/>
<path d="M600,432 L203,432" class="flow" marker-end="url(#cuda-03-host-device-copy-arrow)"/>
<text x="216" y="424" class="t-label" data-w="75">5. copy out</text>
<path d="M328,168 L880,168 L880,253" class="s-blue w15 nofill" marker-end="url(#cuda-03-host-device-copy-arrow-blue)"/>
<text x="344" y="160" class="t-label f-blue-ink" data-w="61">3. launch</text>
<path d="M816,256 L816,200 L331,200" class="s-purple w15 nofill" marker-end="url(#cuda-03-host-device-copy-arrow-purple)"/>
<text x="344" y="224" class="t-label f-purple-ink" data-w="97">4. synchronize</text>
<path d="M704,280 L773,280" class="flow" marker-end="url(#cuda-03-host-device-copy-arrow)"/>
<path d="M704,336 L773,336" class="flow" marker-end="url(#cuda-03-host-device-copy-arrow)"/>
<path d="M776,432 L707,432" class="flow" marker-end="url(#cuda-03-host-device-copy-arrow)"/>
<text x="40" y="504" class="t-note" data-w="554">The kernel's road to global memory is over ten times wider than the bus that fills it.</text>
