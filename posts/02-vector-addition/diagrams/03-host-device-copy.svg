<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-03-host-device-copy-title" aria-describedby="cuda-03-host-device-copy-desc">
<title id="cuda-03-host-device-copy-title">Two memories, six steps, and a narrow road between them</title>
<desc id="cuda-03-host-device-copy-desc">Left, the host: the host program and three arrays in host memory, h_A, h_B and h_C. Right, the device: d_A, d_B and d_C in global memory and the vectorAdd kernel, where thread i writes C[i] = A[i] + B[i]. A purple dashed line between them is the PCIe 3.0 bus of 16 lanes, measured at 11.6 GB/s from pinned memory and 3.5 GB/s from pageable memory. The kernel reads and writes global memory at a measured 145.0 GB/s. Numbered steps: 1 allocate d_A, d_B, d_C; 2 copy the inputs in across the bus; 3 launch from the host program; 4 synchronize; 5 copy the result out; 6 free.</desc>
