<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-04-benchmark-title" aria-describedby="cuda-04-benchmark-desc">
<title id="cuda-04-benchmark-title">The copies set a floor; only the kernel alone pulls away</title>
<desc id="cuda-04-benchmark-desc">A log-log chart of time in microseconds against N, from 1,000 to 10 million elements, for four measured variants of vector addition. CPU on one thread: 0.1, 1.9, 28.1, 897.4, 13.66 ms (microseconds unless marked). CPU with OpenMP: 6.4, 6.9, 31.5, 420.9, 12.15 ms. GPU with copies: 167.3, 141.3, 168.3, 1.30 ms, 12.76 ms. GPU kernel alone: 3.6, 3.8, 9.8, 84.8, 827.8. A dashed line is the derived floor at 160 GB/s, from 0.075 to 750 microseconds; at 10 million elements the kernel reaches 145.0 GB/s.</desc>
