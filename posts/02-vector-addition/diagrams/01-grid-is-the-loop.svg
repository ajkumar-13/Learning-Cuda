<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-01-grid-is-the-loop-title" aria-describedby="cuda-01-grid-is-the-loop-desc">
<title id="cuda-01-grid-is-the-loop-title">The grid is the loop: one thread per element</title>
<desc id="cuda-01-grid-is-the-loop-desc">Two panels over the same array C of 6 elements, C[0] to C[5], drawn in green above a time axis of steps. Left, the CPU: one thread walks the loop, so in step 1 it writes C[0], in step 2 C[1], and so on to C[5] in step 6: a blue diagonal of 6 cells over 6 steps. Right, the GPU: 6 threads, one per index, write all 6 elements in step 1, drawn as one orange row; steps 2 to 6 are an empty dashed region. A downward arrow on each side marks time. Each thread finds its index with i = blockIdx.x * blockDim.x + threadIdx.x.</desc>
