<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-02-launch-config-title" aria-describedby="cuda-02-launch-config-desc">
<title id="cuda-02-launch-config-title">Six elements need two blocks; the guard stops two threads</title>
<desc id="cuda-02-launch-config-desc">A launch of N = 6 elements with blockSize = 4: blocksPerGrid = (6 + 3) / 4 = 2 blocks, 8 threads. A row of 8 thread cells, i = 0 to 7, under two braces, block 0 with threadIdx.x 0 to 3 and block 1 with threadIdx.x 0 to 3. Threads i = 0 to 5 are orange and each has an arrow down to its cell of the green array C, C[0] to C[5]. Threads i = 6 and 7 are outlined in red: they fail i &lt; N and write nothing. Thread i = 5 is emphasized. Below, the guarded line of the kernel and thread 1 of block 1 worked as i = 1 * 4 + 1 = 5.</desc>
