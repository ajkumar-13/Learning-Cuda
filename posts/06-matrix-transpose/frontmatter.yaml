outcomes:
  - id: o1
    text: "Explain coalesced against strided access by counting the 128-byte lines and 32-byte sectors one warp's access touches."
  - id: o2
    text: "Diagnose why the naive transpose's strided writes waste most of the bytes each sector moves."
  - id: o3
    text: "Stage a 32 x 32 tile through shared memory so that both global accesses of a transpose are coalesced, with the block and tile indices swapped."
  - id: o4
    text: "Place the barrier between the tile's load and its transposed read, and say what it protects."
  - id: o5
    text: "Compute the bank of a shared-memory word, recognize a 32-way bank conflict, and remove it by padding the tile to `[TILE][TILE + 1]`."
  - id: o6
    text: "Measure a transpose against a copy kernel and read each fix as a share of the copy's bandwidth."
