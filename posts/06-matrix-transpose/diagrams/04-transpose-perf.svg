<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-04-transpose-perf-title" aria-describedby="cuda-04-transpose-perf-desc">
<title id="cuda-04-transpose-perf-title">The padded tile reaches 89.5% of a plain copy</title>
<desc id="cuda-04-transpose-perf-desc">Horizontal bars of bandwidth in GB/s for transposing a 4,096 by 4,096 float matrix on the GTX 1650: naive 41.5 and shared unpadded 77.7, in red for their hazards, and shared padded 124.4 in ink. Dotted lines mark the copy kernel at 139.1 GB/s and the theoretical peak at 160 GB/s. As shares of the copy: 30%, 56% and 89.5%.</desc>
<style>
