  .w15 { stroke-width: 1.5; }
  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-ink { fill: var(--cuda-ink); }
  .f-ink-muted { fill: var(--cuda-ink-muted); }
  .f-red { fill: var(--cuda-red); }
  .f-red-ink { fill: var(--cuda-red-ink); }
  .s-ink-muted { stroke: var(--cuda-ink-muted); }
</style>
