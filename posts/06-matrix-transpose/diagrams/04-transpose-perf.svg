<text x="40" y="48" class="t-title" data-w="556">The padded tile reaches 89.5% of a plain copy</text>
<text x="40" y="76" class="t-subtitle" data-w="779">Measured: GTX 1650, compute capability 7.5, CUDA 12.3, October 2026; median of 5 rounds of 20 launches.</text>
