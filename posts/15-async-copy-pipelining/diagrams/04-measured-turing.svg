<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-04-measured-turing-title" aria-describedby="cuda-04-measured-turing-desc">
<title id="cuda-04-measured-turing-title">Pipelining pays only when few warps share an SM</title>
<desc id="cuda-04-measured-turing-desc">Two bar charts of GFLOP/s for a 1,024 cubed matrix multiply. Left, four blocks and 32 warps per SM: the synchronous kernel 332, the __pipeline_ software fallback 296, the register-staged pipeline 323. Right, one block and 8 warps per SM: synchronous 174, fallback 175, register-staged pipeline 281, 1.61 times the synchronous kernel. Notes under the charts give the ratios: 0.89 and 0.97 with four blocks, 1.00 and 1.61 with one.</desc>
<style>
