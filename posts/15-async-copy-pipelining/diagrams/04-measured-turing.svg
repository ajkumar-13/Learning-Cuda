<text x="764" y="412" text-anchor="middle" class="t-note" data-w="198">GFLOP/s, fastest of 5 passes</text>
<text x="40" y="444" class="t-note" data-w="387">fallback 0.89×, via registers 0.97× the synchronous kernel</text>
<text x="496" y="444" class="t-note" data-w="387">fallback 1.00×, via registers 1.61× the synchronous kernel</text>
<text x="40" y="504" class="t-note" data-w="663">With four blocks per SM other blocks cover the stall; with one, only the register pipeline recovers it.</text>
