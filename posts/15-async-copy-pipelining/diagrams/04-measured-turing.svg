<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="608">Pipelining pays only when few warps share an SM</text>
<text x="40" y="76" class="t-subtitle" data-w="804">Measured on the author's GTX 1650 (compute capability 7.5), CUDA 12.3, October 2026, at 1,445 to 1,500 MHz.</text>
<text x="40" y="120" class="t-head" data-w="242">Four blocks per SM, 32 warps</text>
