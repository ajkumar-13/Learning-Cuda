<text x="756.92" y="179.67" class="t-value f-ink" data-w="26">174</text>
<text x="496" y="257" class="t-label" data-w="140">fallback, no cp.async</text>
<text x="757.5" y="257" class="t-value f-ink-muted" data-w="26">175</text>
<text x="496" y="334.33" class="t-label" data-w="82">via registers</text>
