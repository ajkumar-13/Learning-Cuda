<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-03-commit-groups-title" aria-describedby="cuda-03-commit-groups-desc">
<title id="cuda-03-commit-groups-title">Waiting for all but the newest group keeps one tile ahead</title>
<desc id="cuda-03-commit-groups-desc">A table of matmulPipelined over five tiles, one thread's view. Columns: the prologue and iterations t = 0 to 4. Group committed: 0, 1, 2, 3, 4, none; into buffer: 0, 1, 0, 1, 0, none. Wait count: none in the prologue, 1 at t = 0 to 3, 0 at t = 4. Group still in flight after the wait: 0 after the prologue, then 1, 2, 3, 4, none. Compute from buffer 0, 1, 0, 1, 0, and the tile computed is t.</desc>
