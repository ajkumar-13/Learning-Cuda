  .d-proj { stroke-dasharray: 6 4; }
  .d-ref { stroke-dasharray: 1.5 3.5; stroke-linecap: round; }
  .d-lead { stroke-dasharray: 4 4; }
  .f-green { fill: var(--cuda-green); }
  .f-green-soft { fill: var(--cuda-green-soft); }
  .f-purple-ink { fill: var(--cuda-purple-ink); }
  .f-red-ink { fill: var(--cuda-red-ink); }
  .s-green { stroke: var(--cuda-green); }
  .s-ink-muted { stroke: var(--cuda-ink-muted); }
  .w25 { stroke-width: 2.5; }
</style>
<defs>
<marker id="cuda-02-copy-path-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
<marker id="cuda-02-copy-path-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="f-green"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="659">One source line, two copies: via a register or around it</text>
<text x="40" y="76" class="t-subtitle" data-w="732">__pipeline_memcpy_async in matmulPipelined, read from cuobjdump -sass of each build, CUDA 12.3.</text>
<text x="40" y="120" class="t-head" data-w="256">sm_75 build: through a register</text>
<rect x="40" y="136" width="200" height="48" rx="8" class="f-green-soft"/>
<rect x="40" y="136" width="200" height="48" rx="8" class="w15 nofill s-green" data-fit="skip"/>
<text x="140" y="168" text-anchor="middle" class="t-label" data-w="100">global memory</text>
<rect x="40" y="248" width="200" height="48" rx="8" class="f-green-soft"/>
<rect x="40" y="248" width="200" height="48" rx="8" class="w15 nofill s-green" data-fit="skip"/>
<text x="140" y="280" text-anchor="middle" class="t-label" data-w="76">register file</text>
<rect x="40" y="360" width="200" height="48" rx="8" class="f-green-soft"/>
<rect x="40" y="360" width="200" height="48" rx="8" class="w15 nofill s-green" data-fit="skip"/>
<text x="140" y="392" text-anchor="middle" class="t-label" data-w="105">shared memory</text>
<path d="M140,184 L140,245" class="flow" marker-end="url(#cuda-02-copy-path-arrow)"/>
<path d="M140,296 L140,357" class="flow" marker-end="url(#cuda-02-copy-path-arrow)"/>
<text x="156" y="220" class="t-code" data-w="26">LDG</text>
<text x="156" y="332" class="t-code" data-w="26">STS</text>
<text x="212" y="332" class="t-label f-red-ink" data-w="173">waits for the loaded value</text>
<text x="40" y="444" class="t-label f-red-ink" data-w="191">the warp stalls at every copy</text>
<text x="496" y="120" class="t-head" data-w="275">sm_80 build: around the registers</text>
<rect x="496" y="136" width="200" height="48" rx="8" class="f-green-soft"/>
<rect x="496" y="136" width="200" height="48" rx="8" class="w15 nofill s-green" data-fit="skip"/>
<text x="596" y="168" text-anchor="middle" class="t-label" data-w="100">global memory</text>
<rect x="496" y="360" width="200" height="48" rx="8" class="f-green-soft"/>
<rect x="496" y="360" width="200" height="48" rx="8" class="w15 nofill s-green" data-fit="skip"/>
<text x="596" y="392" text-anchor="middle" class="t-label" data-w="105">shared memory</text>
<rect x="720" y="248" width="200" height="48" rx="8" class="w1 nofill s-ink-muted d-proj" data-fit="skip"/>
<text x="820" y="280" text-anchor="middle" class="t-note" data-w="133">register file: unused</text>
<path d="M596,184 L596,357" class="s-green w25 nofill" marker-end="url(#cuda-02-copy-path-arrow-green)"/>
<text x="612" y="264" class="t-code" data-w="52">LDGSTS</text>
<text x="612" y="288" class="t-code" data-w="94">cp.async.ca</text>
<text x="496" y="444" class="t-code f-purple-ink" data-w="154">DEPBAR.LE SB0, 0x1</text>
<text x="672" y="444" class="t-label f-purple-ink" data-w="201">the only wait, before the math</text>
<text x="40" y="504" class="t-note" data-w="522">On sm_75 the warp stalls at the store; on sm_80 it stalls only where it asks to.</text>
</svg>
