<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-02-copy-path-title" aria-describedby="cuda-02-copy-path-desc">
<title id="cuda-02-copy-path-title">One source line, two copies: via a register or around it</title>
<desc id="cuda-02-copy-path-desc">Two panels, each with global memory above shared memory. Left, the sm_75 build: LDG loads the float from global memory into the register file, STS stores it from the register into shared memory, and the warp waits at the STS until the load returns. Right, the sm_80 build: one LDGSTS instruction, the PTX cp.async.ca, copies global memory to shared memory without the register file, which is drawn dashed and unused, and the warp waits only at DEPBAR.LE SB0, 0x1, the cp.async.wait_group 1 of __pipeline_wait_prior(1).</desc>
<style>
