<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-03-warp-shuffle-title" aria-describedby="cuda-03-warp-shuffle-desc">
<title id="cuda-03-warp-shuffle-title">A warp sums in its registers, no shared memory</title>
<desc id="cuda-03-warp-shuffle-desc">Eight lanes, lane 0 to lane 7, each holding one register: 3 1 7 0 4 1 6 3. At offset 4 every lane adds the register of the lane four above; lanes 0 to 3 now hold 7 2 13 3, in orange, with arrows from lanes 4 to 7. At offset 2 lanes 0 and 1 hold 20 and 5; at offset 1 lane 0 holds 25, the sum, in green. The other lanes also add at every step, and their values, unfilled, are never read. A full warp of 32 lanes takes five steps, offsets 16, 8, 4, 2 and 1.</desc>
