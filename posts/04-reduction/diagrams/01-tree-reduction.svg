<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-01-tree-reduction-title" aria-describedby="cuda-01-tree-reduction-desc">
<title id="cuda-01-tree-reduction-title">A tree sums eight values in three parallel steps</title>
<desc id="cuda-01-tree-reduction-desc">The shared array s drawn four times, top to bottom. It starts with eight values, 3 1 7 0 4 1 6 3, in green. At stride 4, threads 0 to 3 each add the element four places up into their own, giving 7 2 13 3 in orange; at stride 2 threads 0 and 1 give 20 and 5; at stride 1 thread 0 gives 25, the sum, emphasized in green. Arrows show the two inputs of every addition. At the right, 4, 2 and 1 threads add at the three steps; 16,777,216 values would need 24 steps.</desc>
