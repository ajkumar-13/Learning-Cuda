<text x="856" y="112" text-anchor="end" class="t-note" data-w="175">theoretical peak 160 GB/s</text>
<text x="40" y="504" class="t-note" data-w="723">Bandwidth is the 64 MiB input over the time; each GPU row below the atomic adds one fix to the row above.</text>
