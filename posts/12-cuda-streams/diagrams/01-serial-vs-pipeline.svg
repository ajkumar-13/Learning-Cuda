<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-01-serial-vs-pipeline-title" aria-describedby="cuda-01-serial-vs-pipeline-desc">
<title id="cuda-01-serial-vs-pipeline-title">Streams hide the kernel behind the copies, not the copies</title>
<desc id="cuda-01-serial-vs-pipeline-desc">Two timelines on one axis in milliseconds, each with lanes for the copy in, the kernel and the copy out of 16,777,216 floats with 64 extra rounds of work per element. Top, serial: A and B copied in, 11.01 ms together, then the kernel 9.44 ms, then C copied out 6.79 ms, one engine busy at a time; the measured serial run took 26.62 ms. Bottom, four streams: four chunks, each with bars A, B, the kernel and C that end at the CUDA events of the fastest pass, with starts inferred; the kernel of one chunk runs while the next chunk is copied in, and the copies in and out mostly follow one another. The last copy out ends at 18.32 ms, near the 17.80 ms the two copies take end to end.</desc>
