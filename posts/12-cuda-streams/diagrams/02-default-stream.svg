<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-02-default-stream-title" aria-describedby="cuda-02-default-stream-desc">
<title id="cuda-02-default-stream-title">Streams overlap until a default-stream command fences them</title>
<desc id="cuda-02-default-stream-desc">Two timelines with lanes for stream 1, stream 2 and the default stream. Top: stream 1 copies in, runs a kernel and copies out, in that order; stream 2 does the same, and its copy and kernel overlap those of stream 1, and both finish at time 11. Bottom: the same work with one cudaMemcpy on the default stream issued after stream 1's kernel. It waits for the work issued before it, everything issued after it in both streams waits for it, the waits are red, and the work finishes at time 16.</desc>
