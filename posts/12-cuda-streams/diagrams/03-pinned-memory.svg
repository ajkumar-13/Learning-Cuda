      --cuda-neutral-3: #6E6E68;
      --cuda-on-fill: #14161A;
      --cuda-on-accent: #1A1A1A;
      --cuda-grid: #23262D;
      --cuda-rule: #6A6D74;
      --cuda-arrow: #9A9A94;
      --cuda-neutral-soft: #1C1E23;
      --cuda-blue: #5AA8E0;
      --cuda-blue-ink: #7DBBE8;
      --cuda-blue-soft: #14283A;
      --cuda-blue-line: #2E5878;
      --cuda-orange: #E8B040;
