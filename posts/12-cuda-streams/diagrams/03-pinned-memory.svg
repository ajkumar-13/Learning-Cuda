<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-03-pinned-memory-title" aria-describedby="cuda-03-pinned-memory-desc">
<title id="cuda-03-pinned-memory-title">From pageable memory every copy is staged by the CPU</title>
<desc id="cuda-03-pinned-memory-desc">Two rows, host on the left and device on the right of a purple dashed boundary. Top, pageable memory from an ordinary allocation: the CPU first copies each piece into a pinned staging buffer the driver owns, in red, and only then does the GPU's DMA engine copy it across; vector addition with its copies took 53.60 ms serially and 50.01 ms on four streams. Bottom, pinned memory from cudaMallocHost: the DMA engine reads it directly; 18.95 ms serially and 17.00 ms on four streams.</desc>
<style>
