    --cuda-red: #A8322A;
    --cuda-red-ink: #8F2A23;
    --cuda-red-soft: #F8E3E1;
    --cuda-red-line: #DDA49F;
    --cuda-purple: #A14D8C;
    --cuda-purple-ink: #833E72;
    --cuda-purple-soft: #F4E4EF;
