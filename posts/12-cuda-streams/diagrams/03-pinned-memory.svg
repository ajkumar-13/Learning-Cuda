<defs>
<marker id="cuda-03-pinned-memory-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="arrowhead"/></marker>
<marker id="cuda-03-pinned-memory-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" class="f-red"/></marker>
</defs>
<rect class="bg" data-fit="skip" x="0" y="0" width="960" height="540"/>
<text x="40" y="48" class="t-title" data-w="689">From pageable memory every copy is staged by the CPU</text>
<text x="40" y="76" class="t-subtitle" data-w="801">Vector addition over 16,777,216 floats with its three copies; measured on the author's GTX 1650, October 2026.</text>
<path d="M600,112 L600,476" class="s-purple w15 nofill d-proj"/>
<text x="588" y="468" text-anchor="end" class="t-head f-blue-ink" data-w="37">host</text>
<text x="612" y="468" class="t-head f-orange-ink" data-w="159">device, across PCIe</text>
<text x="40" y="136" class="t-head" data-w="279">Pageable: new, malloc, std::vector</text>
<rect x="40" y="184" width="176" height="64" rx="8" class="f-green-soft s-green-line w1"/>
<text x="56" y="212" class="t-label" data-w="60">the array</text>
<text x="56" y="232" class="t-note" data-w="115">pages may move</text>
<rect x="296" y="184" width="248" height="64" rx="8" class="f-green-soft s-green-line w1"/>
<text x="312" y="212" class="t-label" data-w="94">staging buffer</text>
<text x="312" y="232" class="t-note" data-w="186">pinned, owned by the driver</text>
<rect x="704" y="184" width="216" height="64" rx="8" class="f-green-soft s-green-line w1"/>
<text x="720" y="212" class="t-label" data-w="100">global memory</text>
<text x="720" y="232" class="t-code" data-w="112">d_A, d_B, d_C</text>
<path d="M216,216 L293,216" class="s-red w15 nofill" marker-end="url(#cuda-03-pinned-memory-arrow-red)"/>
<text x="224" y="172" class="t-label f-red-ink" data-w="121">1. the CPU copies</text>
<path d="M544,216 L701,216" class="flow" marker-end="url(#cuda-03-pinned-memory-arrow)"/>
<text x="616" y="172" class="t-label" data-w="50">2. DMA</text>
<text x="40" y="280" class="t-label f-red-ink" data-w="388">serial 53.60 ms, four streams 50.01 ms: no overlap to gain</text>
<text x="40" y="328" class="t-head" data-w="200">Pinned: cudaMallocHost</text>
<rect x="40" y="376" width="176" height="64" rx="8" class="f-green-soft s-green-line w1"/>
<text x="56" y="404" class="t-label" data-w="60">the array</text>
<text x="56" y="424" class="t-note" data-w="84">page-locked</text>
<rect x="704" y="376" width="216" height="64" rx="8" class="f-green-soft s-green-line w1"/>
<text x="720" y="404" class="t-label" data-w="100">global memory</text>
<text x="720" y="424" class="t-code" data-w="112">d_A, d_B, d_C</text>
<path d="M216,408 L701,408" class="flow" marker-end="url(#cuda-03-pinned-memory-arrow)"/>
<text x="296" y="364" class="t-label" data-w="192">DMA, straight from the array</text>
<text x="40" y="472" class="t-label" data-w="259">serial 18.95 ms, four streams 17.00 ms</text>
<text x="40" y="504" class="t-note" data-w="531">Pinning removes the CPU's copy, and only then can a copy run beside a kernel.</text>
</svg>
