<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="cuda-04-streams-perf-title" aria-describedby="cuda-04-streams-perf-desc">
<title id="cuda-04-streams-perf-title">Pinned memory buys the most; streams then hide the kernel</title>
<desc id="cuda-04-streams-perf-desc">Two horizontal bar charts of end-to-end time in milliseconds, vector addition on the left and the kernel with 64 extra rounds on the right, for nine methods. Times, vector add and extra rounds: serial, pageable: 53.60 and 57.60; serial, pinned: 18.95 and 26.62; 1 stream, pinned: 18.82 and 26.65; 2 streams, pinned: 17.51 and 19.94; 4 streams, pinned: 17.00 and 18.11; 8 streams, pinned: 16.66 and 17.34; 16 streams, pinned: 16.77 and 17.22; 32 streams, pinned: 16.76 and 17.14; 4 streams, pageable: 50.01 and 58.39. The two pageable rows are red. A dashed line at 17.80 ms marks the two copies measured alone, end to end.</desc>
